<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>User Registration</title>
    <link rel="stylesheet" href="registerUser.css"/>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>Register Form</h2>
    </div>

    <form id="userForm">
        <div class="form-group">
            <label for="name">Name</label>
            <input
                    id="name"
                    placeholder="Enter your name"
                    required
                    type="text"
            />
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                    id="email"
                    placeholder="Enter your email"
                    required
                    type="email"
            />
        </div>

        <button type="submit" class="btn btn-primary">
            Register User
        </button>
    </form>

    <p id="message" class="message"></p>

    <div class="footer-nav">
        <a href="viewUsers.html" class="btn btn-secondary">
            View All Users →
        </a>
    </div>
</div>

<script src="registerUser.js"></script>
</body>
</html>
