<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Registered Users</title>
    <link rel="stylesheet" href="registerUser.css">
</head>
<body>

<div class="card">
    <div class="header">
        <h2>Update User</h2>
    </div>

    <form id="updateForm">
        <div class="form-group">
            <label for="name">Name</label>
            <input id="name" type="text" required maxlength="50" />
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input id="email" type="email" required />
        </div>

        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>

    <p id="message" class="message"></p>

    <div class="footer-nav">
        <a href="viewUsers.html" class="btn btn-secondary">← Back to Users</a>
    </div>
</div>
<script src="updateUser.js"></script>
</body>
</html>
